# AI 全栈开发开机/关机流程配置

## 版本: v1.0
## 创建日期: 2026-03-08
## 适用项目: 象棋AI混合代理教学与对弈系统

---

## 一、开机流程配置

### 1.1 开机流程概述

开机流程定义了每次AI开发会话开始时必须执行的标准化步骤，确保AI代理能够：
- 正确理解项目当前状态
- 获取必要的上下文信息
- 确认开发环境和工具可用
- 明确当前任务和目标

### 1.2 开机流程步骤

```yaml
startup_sequence:
  name: "AI全栈开发开机流程"
  version: "1.0"
  
  steps:
    # Step 1: 环境检查
    - id: "env_check"
      name: "环境检查"
      description: "验证开发环境和依赖是否就绪"
      required: true
      actions:
        - type: "command"
          command: "python --version"
          expected_output_contains: "3.10"
          on_failure: "提示用户安装Python 3.10+"
        - type: "command"
          command: "pip list | findstr gradio"
          expected_output_contains: "gradio"
          on_failure: "提示用户运行 pip install -r requirements.txt"
        - type: "file_check"
          path: "data/engine/pikafish-avx2.exe"
          on_failure: "提示用户下载Pikafish引擎"
      success_criteria:
        - Python版本 >= 3.10
        - 核心依赖已安装
        - 引擎文件存在

    # Step 2: 读取状态文件
    - id: "read_status"
      name: "读取状态文件"
      description: "读取项目当前状态和进度"
      required: true
      actions:
        - type: "read_file"
          path: "docs/ITERATION_LOG.md"
          purpose: "了解当前Sprint进度"
          extract_info:
            - "当前Sprint编号"
            - "当前任务状态"
            - "已完成交付物"
        - type: "read_file"
          path: "docs/TRACEABILITY.md"
          purpose: "了解功能追溯关系"
          extract_info:
            - "已完成功能列表"
            - "待完成功能"
        - type: "read_file"
          path: "docs/COMPETITION_PLAN.md"
          purpose: "了解参赛规划"
          extract_info:
            - "当前阶段"
            - "截止日期"
            - "优先级任务"
        - type: "read_file"
          path: "CLAUDE.md"
          purpose: "了解开发规范"
          extract_info:
            - "门禁要求"
            - "当前Sprint任务"
            - "验收标准"
      success_criteria:
        - 所有状态文件存在且可读
        - 当前Sprint已确定
        - 任务优先级已明确

    # Step 3: 确认当前任务
    - id: "confirm_task"
      name: "确认当前任务"
      description: "根据状态文件确定当前应执行的任务"
      required: true
      actions:
        - type: "determine"
          logic: |
            1. 从ITERATION_LOG获取当前Sprint
            2. 从CLAUDE.md获取Sprint任务列表
            3. 对比TRACEABILITY确认已完成项
            4. 确定下一个待完成任务
        - type: "display"
          content: |
            ## 当前状态
            - **Sprint**: {current_sprint}
            - **阶段**: {current_phase}
            - **当前任务**: {current_task}
            - **优先级**: {priority}
      success_criteria:
        - 当前任务已明确
        - 任务依赖已确认

    # Step 4: 运行测试验证
    - id: "run_tests"
      name: "运行测试验证"
      description: "验证当前代码状态"
      required: true
      actions:
        - type: "command"
          command: "pytest -q"
          expected_output_contains: "passed"
          on_failure: "显示失败测试，询问是否修复"
        - type: "command"
          command: "python -c \"import core; print('Core modules OK')\""
          expected_output_contains: "OK"
          on_failure: "提示检查模块导入"
      success_criteria:
        - pytest全部通过
        - 核心模块可导入

    # Step 5: 启动服务验证
    - id: "start_services"
      name: "启动服务验证"
      description: "验证核心服务是否可启动"
      required: false
      actions:
        - type: "command"
          command: "python apps/web-gradio/app.py"
          mode: "background"
          wait_seconds: 5
          expected_output_contains: "Running on local URL"
          on_failure: "显示错误日志"
        - type: "check_port"
          port: 7861
          on_failure: "提示端口被占用，执行清理"
      success_criteria:
        - Gradio服务启动成功
        - 端口可访问

    # Step 6: 生成开机报告
    - id: "generate_report"
      name: "生成开机报告"
      description: "汇总开机状态并展示给用户"
      required: true
      actions:
        - type: "display"
          content: |
            ## ✅ AI全栈开发环境开机完成
            
            ### 环境状态
            | 项目 | 状态 |
            |------|------|
            | Python版本 | ✅ {python_version} |
            | 依赖包 | ✅ 已安装 |
            | 引擎文件 | ✅ 已就绪 |
            | 测试状态 | ✅ {test_count} passed |
            
            ### 当前任务
            - **Sprint**: {current_sprint}
            - **任务**: {current_task}
            - **优先级**: {priority}
            
            ### 快速命令
            ```bash
            # 启动前端
            python apps/web-gradio/app.py
            
            # 运行测试
            pytest -q
            
            # 查看当前Sprint文档
            # 参考: docs/ITERATION_LOG.md
            ```
            
            ### 下一步
            请告诉我您要执行的任务，我将开始开发。
      success_criteria:
        - 报告已生成
        - 用户已确认

  rollback:
    on_step_failure:
      env_check: "提示用户检查环境配置"
      read_status: "提示用户检查文档完整性"
      confirm_task: "提示用户确认任务"
      run_tests: "询问是否先修复测试"
      start_services: "询问是否继续（服务非必须）"
```

