## 二、关机流程配置

### 2.1 关机流程概述

关机流程定义了每次AI开发会话结束时必须执行的标准化步骤，确保：
- 所有变更已保存
- 文档已更新
- 状态已记录
- 下次会话可无缝继续

### 2.2 关机流程步骤

```yaml
shutdown_sequence:
  name: "AI全栈开发关机流程"
  version: "1.0"
  
  steps:
    # Step 1: 检查未保存变更
    - id: "check_changes"
      name: "检查未保存变更"
      description: "确认所有代码变更已保存"
      required: true
      actions:
        - type: "command"
          command: "git status --porcelain"
          expected_output_pattern: ".*"
          on_non_empty: "列出未保存文件，询问是否保存"
        - type: "display"
          content: |
            ## 未保存变更
            {changed_files}
            
            是否保存这些变更？
      success_criteria:
        - 用户已确认变更处理方式

    # Step 2: 运行测试验证
    - id: "run_final_tests"
      name: "运行最终测试"
      description: "确保所有测试通过后再关机"
      required: true
      actions:
        - type: "command"
          command: "pytest -q"
          expected_output_contains: "passed"
          on_failure: "显示失败测试，阻止关机"
      success_criteria:
        - pytest全部通过
        - 无测试失败

    # Step 3: 更新迭代日志
    - id: "update_iteration_log"
      name: "更新迭代日志"
      description: "记录本次会话完成的工作"
      required: true
      actions:
        - type: "update_file"
          path: "docs/ITERATION_LOG.md"
          template: |
            ## 会话记录 {session_id}
            **Date**: {current_date}
            **Duration**: {session_duration}
            
            ### 完成任务
            1. {task_1}
            2. {task_2}
            
            ### 代码变更
            - {file_1}: {change_description_1}
            - {file_2}: {change_description_2}
            
            ### 测试状态
            - pytest: ✅ {test_count} passed
            
            ### 下次继续
            - 待完成任务: {next_task}
            - 注意事项: {notes}
            
            ---
        - type: "confirm"
          message: "已更新ITERATION_LOG.md，请确认内容正确"
      success_criteria:
        - ITERATION_LOG已更新
        - 用户已确认

    # Step 4: 更新追溯矩阵
    - id: "update_traceability"
      name: "更新追溯矩阵"
      description: "记录功能与代码的追溯关系"
      required: true
      actions:
        - type: "update_file"
          path: "docs/TRACEABILITY.md"
          template: |
            | Feature | PRD Ref | TECH Ref | Code | Tests | Evidence | Status |
            |---------|---------|----------|------|-------|----------|--------|
            | {feature_name} | {prd_ref} | {tech_ref} | {code_path} | {test_command} | {evidence} | {status} |
        - type: "confirm"
          message: "已更新TRACEABILITY.md，请确认追溯记录正确"
      success_criteria:
        - TRACEABILITY已更新
        - 用户已确认

    # Step 5: 生成关机报告
    - id: "generate_shutdown_report"
      name: "生成关机报告"
      description: "汇总本次会话成果"
      required: true
      actions:
        - type: "display"
          content: |
            ## ✅ AI全栈开发会话结束
            
            ### 会话摘要
            | 项目 | 内容 |
            |------|------|
            | 会话时长 | {session_duration} |
            | 完成任务 | {completed_tasks} |
            | 代码变更 | {changed_files_count} 文件 |
            | 测试状态 | ✅ {test_count} passed |
            
            ### 已更新文档
            - ✅ docs/ITERATION_LOG.md
            - ✅ docs/TRACEABILITY.md
            
            ### 下次会话提示
            下次开机时，AI将自动读取以下文件恢复状态：
            - `docs/ITERATION_LOG.md` - 当前进度
            - `docs/TRACEABILITY.md` - 功能追溯
            - `CLAUDE.md` - 开发规范
            
            ### 待完成任务
            1. {next_task_1}
            2. {next_task_2}
            
            ---
            **会话已安全结束，感谢使用！**
      success_criteria:
        - 报告已生成
        - 用户已确认

    # Step 6: 清理临时资源
    - id: "cleanup"
      name: "清理临时资源"
      description: "释放临时文件和进程"
      required: false
      actions:
        - type: "command"
          command: "taskkill /IM python.exe /F 2>nul || echo 'No Python processes to kill'"
          on_failure: "忽略"
        - type: "command"
          command: "del /Q %TEMP%\\*.tmp 2>nul || echo 'Temp files cleaned'"
          on_failure: "忽略"
      success_criteria:
        - 临时资源已清理

  rollback:
    on_step_failure:
      check_changes: "强制保存或放弃变更"
      run_final_tests: "阻止关机，要求修复测试"
      update_iteration_log: "阻止关机，要求手动更新"
      update_traceability: "阻止关机，要求手动更新"
```

