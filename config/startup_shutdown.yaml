## 三、门禁检查配置

### 3.1 门禁规则

```yaml
gates:
  pre_commit:
    name: "提交前门禁"
    checks:
      - id: "pytest_pass"
        name: "测试通过"
        command: "pytest -q"
        required: true
        failure_action: "block"
        
      - id: "docs_updated"
        name: "文档已更新"
        files:
          - "docs/ITERATION_LOG.md"
          - "docs/TRACEABILITY.md"
        required: true
        failure_action: "block"
        
      - id: "no_debug_code"
        name: "无调试代码"
        patterns:
          - "print\\("
          - "console\\.log"
          - "TODO:"
          - "FIXME:"
        required: false
        failure_action: "warn"

  pre_shutdown:
    name: "关机前门禁"
    checks:
      - id: "all_tests_pass"
        name: "所有测试通过"
        command: "pytest -q"
        required: true
        failure_action: "block"
        
      - id: "iteration_log_updated"
        name: "迭代日志已更新"
        file: "docs/ITERATION_LOG.md"
        check_modified: true
        required: true
        failure_action: "block"
        
      - id: "traceability_updated"
        name: "追溯矩阵已更新"
        file: "docs/TRACEABILITY.md"
        check_modified: true
        required: true
        failure_action: "block"
```

