## Neo4j 知识图谱使用说明

### 1. 图谱文件位置

Neo4j 数据存储在数据库目录中，不是普通文件：

```
# 默认数据位置（Windows）



# 或者通过 Neo4j Desktop 查看
```

### 2. 如何访问

**方式一：Neo4j Desktop（推荐）**
```
1. 打开 Neo4j Desktop
2. 启动项目 "xiangqi" 
3. 点击 "Open" → 浏览器打开 http://localhost:7474
4. 用户名: neo4j, 密码: xiangqi123
```

**方式二：命令行**
```bash
# 连接 Neo4j
cypher-shell -u neo4j -p xiangqi123

# 查询示例
MATCH (g:Game) RETURN count(g);
MATCH (p:Position) RETURN count(p);
```

**方式三：Python 代码**
```python
from core.kg.neo4j_kg import Neo4jKG

kg = Neo4jKG()
kg.connect()

# 查询统计
stats = kg.get_statistics()
print(stats)  # {'games': 199213, 'positions': 7906885, ...}

# 搜索棋手
games = kg.search_games(player='许银川', limit=10)
```

### 3. 下次如何开启

**步骤：**
```bash
# 1. 启动 Neo4j 服务
# 方式A: Neo4j Desktop → 点击 Start
# 方式B: 命令行
neo4j start

# 2. 验证服务运行
# 浏览器访问 http://localhost:7474

# 3. 启动应用
cd d:\xiangqi-hybrid-agent
python apps/web-gradio/app.py
```

### 4. 连接配置

配置文件位置：`core/kg/neo4j_kg.py`

```python
