<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试页面</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>API 测试页面</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        async function testAPI() {
            const initialBoard = [
                ['r', 'n', 'b', 'a', 'k', 'a', 'b', 'n', 'r'],
                ['', '', '', '', '', '', '', '', ''],
                ['', 'c', '', '', '', '', '', 'c', ''],
                ['p', '', 'p', '', 'p', '', 'p', '', 'p'],
                ['', '', '', '', '', '', '', '', ''],
                ['', '', '', '', '', '', '', '', ''],
                ['P', '', 'P', '', 'P', '', 'P', '', 'P'],
                ['', 'C', '', '', '', '', '', 'C', ''],
                ['', '', '', '', '', '', '', '', ''],
                ['R', 'N', 'B', 'A', 'K', 'A', 'B', 'N', 'R'],
            ];

            try {
                const response = await fetch('http://localhost:8000/api/legal-moves', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ board: initialBoard, row: 9, col: 1 })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    results.innerHTML += `<div class="test-result success">✅ API 调用成功！<br>红马合法走法：${JSON.stringify(data.moves)}</div>`;
                } else {
                    results.innerHTML += `<div class="test-result error">❌ API 返回错误：${data.detail || JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                results.innerHTML += `<div class="test-result error">❌ 网络错误：${error.message}</div>`;
            }
        }

        testAPI();
    </script>
</body>
</html>
